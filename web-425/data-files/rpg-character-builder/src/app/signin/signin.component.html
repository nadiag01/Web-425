<!-- signin.component.html -->
<div class="signin-container">
  <h2>Sign In</h2>
  <form [formGroup]="signinForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Enter your email"
      />
      <div *ngIf="signinForm.get('email').touched && signinForm.get('email').invalid">
        <small *ngIf="signinForm.get('email').errors?.['required']">Email is required.</small>
        <small *ngIf="signinForm.get('email').errors?.['email']">Invalid email format.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Enter your password"
      />
      <div *ngIf="signinForm.get('password').touched && signinForm.get('password').invalid">
        <small *ngIf="signinForm.get('password').errors?.['required']">Password is required.</small>
      </div>
    </div>

    <button type="submit" [disabled]="signinForm.invalid">Sign In</button>
  </form>
</div>
